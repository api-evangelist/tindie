aid: tindie
name: Tindie
description: >-
  Tindie is an online marketplace for indie electronics and maker hardware — DIY
  kits, robotics, 3D-printing gear, IoT boards, and open-source hardware sold
  directly by independent creators worldwide. Tindie publishes a small public
  REST API built on Django Tastypie that exposes product listings and, for
  authenticated sellers, their orders and order line items, using API-key
  authentication (ApiKey) and standard Tastypie limit/offset pagination with a
  self-describing per-resource schema surface.
